<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地狱注册表单</title>
<style>
  :root{ --bg:#12111a; --card:#1c1b26; --line:#2f2d3d; --text:#eceaf5; --dim:#9b97b3; --hot:#ff4d6d; --ok:#3ddc97; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
        font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; }
  header{ display:flex; gap:24px; align-items:center; justify-content:space-between;
          padding:14px 24px; border-bottom:1px solid var(--line); background:#191825;
          position:sticky; top:0; }
  header h1{ font-size:17px; margin:0; letter-spacing:.5px; }
  .stats{ display:flex; gap:20px; font-variant-numeric:tabular-nums; font-size:14px; color:var(--dim); }
  .stats b{ color:var(--hot); font-size:17px; }
  main{ max-width:620px; margin:40px auto 120px; padding:0 20px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:26px; margin-bottom:22px; }
  .label{ font-size:15px; font-weight:600; margin-bottom:6px; }
  .hint{ font-size:12.5px; color:var(--dim); margin-bottom:16px; line-height:1.6; }
  .age-row{ display:flex; align-items:center; gap:16px; }
  .age-val{ font-size:42px; font-weight:700; min-width:90px; text-align:center;
            font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; cursor:pointer; border:none; border-radius:10px;
          color:#fff; font-weight:600; }
  .minus{ background:var(--hot); font-size:26px; padding:20px 42px; }
  .plus{ background:#3a3850; font-size:11px; padding:5px 9px; }
  .toggles{ display:grid; gap:12px; }
  .tg{ display:flex; align-items:center; gap:14px; padding:12px 14px;
       background:#232130; border-radius:10px; font-size:13.5px; line-height:1.5; }
  .sw{ flex:0 0 46px; height:26px; border-radius:99px; background:#413e57;
       position:relative; transition:background .18s; }
  .sw.on{ background:var(--ok); }
  .sw::after{ content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
              border-radius:50%; background:#fff; transition:left .18s; }
  .sw.on::after{ left:23px; }
  .submit-zone{ height:150px; position:relative; }
  .submit{ background:var(--ok); color:#0d1f17; font-size:17px; padding:15px 40px;
           position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
           transition:left .12s, top .12s; }
  .submit:disabled{ background:#3a3850; color:#6e6a85; cursor:not-allowed; }
  .done{ text-align:center; padding:60px 20px; }
  .done h2{ font-size:30px; margin:0 0 20px; }
  .done .big{ color:var(--hot); font-size:56px; font-weight:700; }
  .cmp{ color:var(--dim); font-size:14px; margin-top:26px; line-height:1.9; }
</style>
</head>
<body>
<header>
  <h1>🔥 地狱注册表单 <span style="color:var(--dim);font-weight:400">/ HackStart 2026</span></h1>
  <div class="stats">
    <span>用时 <b id="t">0.0</b>s</span>
    <span>点击 <b id="c">0</b> 次</span>
  </div>
</header>

<main id="app">
  <div class="card">
    <div class="label">1 · 你的年龄</div>
    <div class="hint">请使用下方按钮调整至你的真实年龄。</div>
    <div class="age-row">
      <button class="minus" id="minus">− 1</button>
      <div class="age-val" id="age">0</div>
      <button class="plus" id="plus">+1</button>
    </div>
  </div>

  <div class="card">
    <div class="label">2 · 隐私偏好</div>
    <div class="hint">请确认以下选项。我们尊重您的选择。</div>
    <div class="toggles" id="tgs"></div>
  </div>

  <div class="card">
    <div class="label">3 · 完成注册</div>
    <div class="hint" id="gate">请先正确完成上方所有步骤。</div>
    <div class="submit-zone" id="zone">
      <button class="submit" id="submit" disabled>提交</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let clicks = 0, start = performance.now(), running = true;

document.addEventListener("click", () => { if (running) $("c").textContent = ++clicks; });
setInterval(() => { if (running) $("t").textContent = ((performance.now()-start)/1000).toFixed(1); }, 100);

/* ---------- 模块 1：只能 +1 的年龄输入 ---------- */
let age = 0;
const TARGET = 18;
const drawAge = () => { $("age").textContent = age; check(); };
$("plus").onclick  = () => { age++; drawAge(); };
$("minus").onclick = () => { age = Math.max(0, age - 1); drawAge(); };

/* ---------- 模块 2：双重否定开关 ---------- */
const ROWS = [
  { text: "我不希望不接收营销邮件",              want: false },
  { text: "请勿取消我拒绝共享数据的决定",        want: true  },
  { text: "我并非不同意停止使用非必要 Cookie",    want: true  },
  { text: "不要不把我的偏好视作未被撤回",        want: false },
];
const state = ROWS.map(() => false);
ROWS.forEach((r, i) => {
  const d = document.createElement("div");
  d.className = "tg";
  d.innerHTML = '<div class="sw"></div><div>' + r.text + '</div>';
  d.onclick = () => { state[i] = !state[i]; d.firstChild.classList.toggle("on", state[i]); check(); };
  $("tgs").appendChild(d);
});

/* ---------- 校验 ---------- */
function check(){
  const ok = age >= TARGET && ROWS.every((r,i) => state[i] === r.want);
  $("submit").disabled = !ok;
  $("gate").textContent = ok ? "很好。现在点击提交即可。" : "请先正确完成上方所有步骤。";
}

/* ---------- 模块 3：会躲的提交按钮 ---------- */
const zone = $("zone"), btn = $("submit");
zone.addEventListener("mousemove", e => {
  if (btn.disabled) return;
  const z = zone.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const dx = e.clientX - (b.left + b.width/2), dy = e.clientY - (b.top + b.height/2);
  if (Math.hypot(dx, dy) > 90) return;
  const nx = Math.min(Math.max(20, e.clientX - z.left - dx * 3), z.width  - b.width/2 - 20);
  const ny = Math.min(Math.max(20, e.clientY - z.top  - dy * 3), z.height - b.height/2 - 20);
  btn.style.left = nx + "px";
  btn.style.top  = ny + "px";
});

btn.onclick = () => {
  running = false;
  const secs = ((performance.now() - start) / 1000).toFixed(1);
  $("app").innerHTML =
    '<div class="done"><h2>🎉 注册成功</h2>' +
    '<div class="big">' + secs + ' 秒</div>' +
    '<div>你一共点击了 <b>' + clicks + '</b> 次</div>' +
    '<div class="cmp">一个正常的注册表单：<b>3 次点击 · 12 秒</b><br>' +
    '本页面的每一个设计，都真实存在于某个线上产品中。</div></div>';
};
</script>
</body>
</html>
